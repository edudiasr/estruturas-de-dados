name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: make test CC=${{ matrix.cc }}
      - name: AddressSanitizer + UBSan
        run: make asan CC=${{ matrix.cc }}

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - run: make valgrind
